[project]
name = "tier2-evaluator"
version = "0.1.0"
description = "Tier-2 evaluation worker (ADR-022): reads finished interviews from Redis Streams, evaluates answers against versioned rubrics and reports to the control plane, which validates every result. No LiveKit, no Tier-1 code, no live-interview writes."
requires-python = ">=3.12,<3.15"
dependencies = [
  "redis>=6.4,<8",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "openai>=3.40,<4",
  "anthropic>=1.0,<2",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.2",
  "ruff>=0.16",
  "mypy>=2.3",
]

[project.scripts]
tier2-evaluator = "tier2_evaluator.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier2_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["redis: needs the redis-server binary (a throwaway local server is started)"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]
allowed-confusables = ["ı"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tier2_evaluator"]
mypy_path = "src"
ignore_missing_imports = true
