openapi: 3.1.0
info:
  title: AI Technical Interviewer — control plane API
  version: 1.0.0-proposed
  summary: Session lifecycle, consent, realtime session issuance, the internal Tier-1 and Tier-2 APIs, human review and reports.
  description: |
    Contract for the Phase 1 control plane (ADR-016). Two listeners serve this document:
    the **public** listener (`/api/v1`, reachable through the same-origin web rewrite) and the
    **internal** listener (`/internal/v1`, `/healthz`, `/readyz`, `/metrics`), which is never routed publicly.

    Staff authenticate with a bearer token, or in the review console with the browser session that a token is
    exchanged for (`ati_ss`, ADR-023). The session is accepted only by the review, report and staff session
    operations; when an `Authorization` header is present it alone decides.

    Cross-cutting rules:
    - Errors are RFC 9457 `application/problem+json` with a stable `code`.
    - Every response carries `X-Request-ID` (echoed when supplied, generated otherwise) and `X-ATI-Environment`.
    - Mutating public endpoints require `Idempotency-Key`; keys are scoped per principal. Replays return the original response;
      reuse with a different body returns `409 idempotency_key_reused`.
    - Mutating public endpoints require `Origin`/`Sec-Fetch-Site` consistent with the configured public origin.
    - State-changing requests carry the `state_version` the client observed; stale versions return `409 stale_state_version`.
    - Interviews outside the caller's tenant or ownership return `404` (no enumeration).
    - Nothing in this API produces rankings or hiring decisions. Rubric scores appear only in staff review and report
      operations (tag `review`): every answer is scored by a human reviewer, AI evaluations are uncalibrated drafts, and
      candidates never see scores (ADR-022).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Public listener (development)
  - url: http://localhost:8081
    description: Internal listener (development; never exposed publicly)
tags:
  - name: staff
  - name: candidate
  - name: review
    description: Human review of every answer and the decision-support report (staff only, ADR-022).
  - name: tier1-internal
  - name: tier2-internal
    description: The Tier-2 evaluator reports attempts and completion; its output is validated before it is kept.
  - name: ops

paths:
  /api/v1/interviews:
    post:
      tags: [staff]
      operationId: createInterview
      summary: Create an interview from a published plan and issue a one-time invitation.
      security: [{staffBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInterviewRequest'}
      responses:
        '201':
          description: Interview created. The invitation URL is returned exactly once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateInterviewResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}:
    get:
      tags: [staff, candidate]
      operationId: getInterview
      summary: Role-specific view of an interview.
      description: >-
        A staff bearer token receives the staff view, which names the candidate (`candidate_ref`): roles admin and
        recruiter only. Reviewers judge answers without knowing whose they are, so they get 403 (ADR-022). The staff
        browser session is not accepted here: a browser that also holds the candidate cookie gets the candidate view.
      security: [{staffBearer: []}, {candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}]
      responses:
        '200':
          description: Staff receive the staff view; the candidate receives the candidate view.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/InterviewStaffView'}
                  - {$ref: '#/components/schemas/InterviewCandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/invitation/revoke:
    post:
      tags: [staff]
      operationId: revokeInvitation
      summary: Revoke the interview's invitation and every candidate session (ADR-016).
      description: |
        The invitation can no longer be exchanged, its access code no longer signs in (ADR-024), and any candidate
        session cookie stops working. A live interview
        is paused with reason `access_revoked` and its media room is deleted at once (self-hosted LiveKit cannot
        revoke a connected participant's token); nobody can resume it, so the pause expires to CANCELLED. Contract
        v1.1 has no staff cancellation, so other states are left unchanged. Repeating the request changes nothing.
      security: [{staffBearer: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: Access revoked (or already revoked).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeInvitationResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/invitations/exchange:
    post:
      tags: [candidate]
      operationId: exchangeInvitation
      summary: Exchange an invitation token for a candidate session cookie (user click only).
      description: |
        Allowed until the invitation expires. Each exchange issues a fresh session cookie and revokes any earlier
        candidate session; only the first exchange moves CREATED to CONSENT_PENDING. The Idempotency-Key header is
        required for uniformity, but responses are never replayed from storage, because that would mean persisting
        a session token. A retry simply yields a new valid cookie. Rate-limited per client address.
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationExchangeRequest'}
      responses:
        '200':
          description: Session established; any earlier candidate session for this interview is revoked.
          headers:
            Set-Cookie:
              description: '`ati_cs` session cookie (HttpOnly; Secure outside dev; SameSite=Strict; Path=/api).'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationExchangeResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /api/v1/candidate/session:
    post:
      tags: [candidate]
      operationId: startCandidateSession
      summary: Sign in with the application number and access code (ADR-024).
      description: |
        The other way into an interview, next to the invitation link: the access code is a second credential of the
        same invitation, so it works until the invitation expires or is revoked, and a sign-in behaves exactly like
        an exchange (a fresh session cookie, any earlier candidate session revoked, CREATED moves to
        CONSENT_PENDING). Both values are read case-insensitively, with spaces and hyphens ignored, O read as 0 and
        I or L as 1. Every refusal is the same 401 `sign_in_failed`: unknown number, wrong code, expired or revoked
        invitation, or a lock. Five wrong codes in a row lock code sign-in for that interview for 15 minutes; the
        lock does not extend while it lasts, and the invitation link keeps working. Rate-limited per client
        address. As with the exchange, the Idempotency-Key header is required but responses are never replayed.
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateSignInRequest'}
      responses:
        '200':
          description: Session established; any earlier candidate session for this interview is revoked.
          headers:
            Set-Cookie:
              description: '`ati_cs` session cookie (HttpOnly; Secure outside dev; SameSite=Strict; Path=/api).'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationExchangeResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/consent-notice:
    get:
      tags: [candidate]
      operationId: getConsentNotice
      summary: The notice version pinned for this interview, with configured retention per category.
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}]
      responses:
        '200':
          description: Notice and retention details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentNoticeView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/consent:
    post:
      tags: [candidate]
      operationId: submitConsent
      summary: Record a decision for every purpose of the pinned notice (T02 or T03).
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentDecisionRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/start:
    post:
      tags: [candidate]
      operationId: startInterview
      summary: READY → CALIBRATION (T04) with a fixed input mode.
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/calibration-complete:
    post:
      tags: [candidate]
      operationId: candidateCalibrationComplete
      summary: Explicit "Begin" — CALIBRATION → QUESTION_ACTIVE (T05).
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StateVersionRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/pause:
    post:
      tags: [candidate]
      operationId: pauseInterview
      summary: Pause from CALIBRATION, QUESTION_ACTIVE or CANDIDATE_SPEAKING (T12, T18, T19).
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidatePauseRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/resume:
    post:
      tags: [candidate]
      operationId: resumeInterview
      summary: PAUSED → QUESTION_ACTIVE (new activation of the same item) or CALIBRATION (T13, T20).
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StateVersionRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/answer-complete:
    post:
      tags: [candidate]
      operationId: candidateRequestAnswerCompletion
      summary: Request finalization of the open activation's answer (request R01). Resolved after the agent's transcript flush or the deadline.
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerCompletionRequest'}
      responses:
        '202':
          description: Request recorded; the answer is finalized once the transcript flush is confirmed or the deadline elapses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewCandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/complete:
    post:
      tags: [candidate]
      operationId: confirmCompletion
      summary: Idempotent confirmation; succeeds only once the interview has completed (completion itself is automatic after the last answer).
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/withdraw:
    post:
      tags: [candidate]
      operationId: withdrawInterview
      summary: Candidate withdrawal → CANCELLED (T21–T25). Deletes the room and stops any recording.
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/realtime-session:
    post:
      tags: [candidate]
      operationId: issueRealtimeSession
      summary: Ensure the room and agent dispatch exist and issue a short-lived candidate media token.
      description: |
        Never replayed from storage, because the response is a media credential: repeating the request (with the
        same or a new Idempotency-Key) is safe and returns a fresh token. Room creation and agent dispatch are
        idempotent under the session lock.
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: Token valid for the initial join only (LiveKit refreshes connected clients).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/text-responses:
    post:
      tags: [candidate]
      operationId: submitTextResponse
      summary: Text-mode answer bound to the open activation (ADR-018). Stored by the control plane as a candidate segment.
      description: >-
        Accepted only in text mode, while a question is open and no completion request is pending; the first answer
        moves QUESTION_ACTIVE to CANDIDATE_SPEAKING. 409 codes: input_mode_mismatch, not_answering, activation_mismatch,
        completion_pending. The text reaches the Tier-1 agent only as untrusted user input.
      security: [{candidateSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TextResponseRequest'}
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TextResponseAccepted'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/interviews/{interview_id}/report:
    get:
      tags: [review]
      operationId: getReport
      summary: Decision-support report, available once every answer has been reviewed (REPORT_READY).
      description: >-
        Built only from reviewer decisions and validated AI evidence. It has no hiring decision, recommendation or
        ranking. Roles: admin, recruiter, reviewer. 404 until the report exists or for another tenant.
      security: [{staffBearer: []}, {staffSession: []}]
      parameters: [{$ref: '#/components/parameters/InterviewId'}]
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/reports:
    get:
      tags: [review]
      operationId: listReports
      summary: The tenant's reports, newest first, without their content. Roles admin, recruiter and reviewer.
      description: >-
        Each entry identifies a report and its plan. It holds no scores and no candidate identity, so the list cannot
        be read as a ranking of candidates (ADR-008).
      security: [{staffBearer: []}, {staffSession: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Reports.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/staff/session:
    post:
      tags: [staff]
      operationId: startStaffSession
      summary: Exchange a staff token for a review console session cookie (ADR-023).
      description: |
        The session lasts `ATI_STAFF_SESSION_TTL` (8 hours by default) or until the staff token expires, whichever
        is first, and ends at once when the token is revoked. A session the browser still presents is revoked. A
        malformed, unknown, expired or revoked token gets the same 401. The request carries no bearer token, so the
        same-origin rule applies (no login CSRF). Like the invitation exchange, responses are never replayed from
        storage: the Idempotency-Key header is required for uniformity. Rate-limited per client address
        (`ATI_STAFF_SIGNINS_PER_MINUTE`).
      security: []
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffSignInRequest'}
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`ati_ss` session cookie (HttpOnly; Secure outside dev; SameSite=Strict; Path=/api; Max-Age = the remaining lifetime).'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffSessionView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    get:
      tags: [staff]
      operationId: getStaffSession
      summary: Who is signed in, with which role, until when.
      security: [{staffBearer: []}, {staffSession: []}]
      responses:
        '200':
          description: The signed-in staff member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffSessionView'}
        '401': {$ref: '#/components/responses/Problem'}

  /api/v1/staff/session/end:
    post:
      tags: [staff]
      operationId: endStaffSession
      summary: Sign out. The session is revoked and the cookie cleared; a bearer token has no session to end.
      security: [{staffBearer: []}, {staffSession: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: Signed out (`ended` is false when there was no session to end).
          headers:
            Set-Cookie:
              description: Clears `ati_ss`.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffSessionEnded'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/review-tasks:
    get:
      tags: [review]
      operationId: listReviewTasks
      summary: >-
        The tenant's review tasks: open ones oldest interview first, completed ones most recently decided interview
        first, each interview's answers together and in order. Roles reviewer and admin.
      security: [{staffBearer: []}, {staffSession: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {enum: [open, completed], default: open}}
        - {name: interview_id, in: query, required: false, description: Only this interview's tasks., schema: {type: string, pattern: '^ses_[A-Za-z0-9]{16,}$'}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Review tasks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewTaskList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/review-tasks/{task_id}:
    get:
      tags: [review]
      operationId: getReviewTask
      summary: One answer to review — question, rubric, candidate transcript, the AI draft if valid — and nothing about the candidate.
      security: [{staffBearer: []}, {staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: The review task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewTask'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/review-tasks/{task_id}/outcome:
    post:
      tags: [review]
      operationId: submitReviewOutcome
      summary: The reviewer's scores and rationale for one answer; the last outcome of an interview writes its report (T17).
      description: >-
        Records the reviewer, the prior AI scores, the revised scores, the rationale, the time, the rubric version and
        whether the reviewer opened the AI draft. 400 invalid_request: scores missing, out of range or not matching the
        rubric's dimensions, scores on an answer whose question has no rubric, or a rationale outside 10 to 4000
        characters. 409 codes: review_not_open (the interview is not in HUMAN_REVIEW), review_already_completed,
        rubric_unavailable (the answer's rubric is not stored). Roles reviewer and admin.
      security: [{staffBearer: []}, {staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecision'}
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewOutcomeResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/claims:
    post:
      tags: [tier1-internal]
      operationId: tier1Claim
      summary: Claim a dispatched session with the one-time nonce and obtain a lease.
      security: [{agentService: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Tier1ClaimRequest'}
      responses:
        '201':
          description: Lease issued. Any previous lease for the session is superseded (higher fencing token).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tier1Lease'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/lease/renew:
    post:
      tags: [tier1-internal]
      operationId: tier1RenewLease
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      responses:
        '200':
          description: Lease renewed; latest context included.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tier1LeaseRenewal'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/lease/release:
    post:
      tags: [tier1-internal]
      operationId: tier1ReleaseLease
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      responses:
        '204': {description: Released.}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/context:
    get:
      tags: [tier1-internal]
      operationId: tier1GetContext
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      responses:
        '200':
          description: The complete Tier-1 allowlist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tier1Context'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/transcript-segments:
    post:
      tags: [tier1-internal]
      operationId: tier1SubmitSegment
      summary: Idempotent, append-only segment ingestion with server-side attribution (ADR-014).
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SegmentSubmission'}
      responses:
        '201': {$ref: '#/components/responses/SegmentAccepted'}
        '200': {$ref: '#/components/responses/SegmentAccepted'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/prompt-started:
    post:
      tags: [tier1-internal]
      operationId: tier1PromptStarted
      summary: Open the answer window of an activation when its prompt starts playing.
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromptStartedRequest'}
      responses:
        '200': {$ref: '#/components/responses/Tier1ContextResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/calibration-complete:
    post:
      tags: [tier1-internal]
      operationId: tier1CalibrationComplete
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StateVersionRequest'}
      responses:
        '200': {$ref: '#/components/responses/Tier1ContextResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/answer-complete:
    post:
      tags: [tier1-internal]
      operationId: tier1AnswerComplete
      summary: Request (tool path) or confirm (button path) answer finalization with a transcript flush manifest.
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Tier1AnswerCompleteRequest'}
      responses:
        '200': {$ref: '#/components/responses/Tier1ContextResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/pause:
    post:
      tags: [tier1-internal]
      operationId: tier1Pause
      summary: Deterministic agent code pauses on provider failure or unavailable audio (never reachable by the model).
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Tier1PauseRequest'}
      responses:
        '200': {$ref: '#/components/responses/Tier1ContextResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/telemetry:
    post:
      tags: [tier1-internal]
      operationId: tier1Telemetry
      summary: Content-free latency metrics and policy flags.
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryReport'}
      responses:
        '202': {description: Accepted.}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier1/sessions/{session_id}/usage:
    post:
      tags: [tier1-internal]
      operationId: tier1Usage
      summary: Cumulative provider usage for the cost model (STACK section 5).
      security: [{agentService: [], agentGrant: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/FencingToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UsageReport'}
      responses:
        '202': {description: Accepted.}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier2/sessions/{session_id}/evaluations:
    post:
      tags: [tier2-internal]
      operationId: tier2RecordEvaluation
      summary: One evaluator attempt for an answer, stored as received and kept as an evaluation only if it validates.
      description: >-
        Accepted only while the interview's evaluation is pending. Idempotent per answer, transcript version, rubric
        version and evaluator version (200 with outcome duplicate). 409 codes: evaluation_not_pending, no_rubric,
        transcript_version_mismatch, synthetic_source, rubric_unavailable.
      security: [{tier2Service: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvaluationSubmission'}
      responses:
        '201':
          description: Attempt recorded (valid, invalid, abstained or failed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedEvaluation'}
        '200':
          description: The evaluation already exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedEvaluation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/tier2/sessions/{session_id}/complete:
    post:
      tags: [tier2-internal]
      operationId: tier2Complete
      summary: Route the interview to human review (T15); with failure_reason, the pipeline gave up and review is the fallback.
      security: [{tier2Service: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteEvaluationRequest'}
      responses:
        '200':
          description: Review tasks exist for every answer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewRouting'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /internal/v1/livekit/webhook:
    post:
      tags: [ops]
      operationId: livekitWebhook
      summary: Signed LiveKit webhook (dedicated key). Deduplicated by event id; actions cross-checked with ListParticipants.
      security: [{livekitWebhook: []}]
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema: {type: object}
      responses:
        '200': {description: Processed or ignored.}
        '401': {$ref: '#/components/responses/Problem'}

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      security: []
      responses:
        '200': {description: Process alive.}

  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      security: []
      responses:
        '200': {description: Dependencies reachable.}
        '503': {$ref: '#/components/responses/Problem'}

  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      security: []
      responses:
        '200':
          description: Prometheus exposition format (no PII, no transcript content).
          content:
            text/plain: {schema: {type: string}}

components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      description: Opaque staff token (stored hashed, expiring, tenant-scoped).
    candidateSession:
      type: apiKey
      in: cookie
      name: ati_cs
    staffSession:
      type: apiKey
      in: cookie
      name: ati_ss
      description: >-
        Review console session (ADR-023): HttpOnly, SameSite=Strict, Path=/api, stored hashed, at most 8 hours by
        default and never longer than its staff token. Accepted only by the review, report and staff session
        operations.
    agentService:
      type: http
      scheme: bearer
      description: Tier-1 agent service credential.
    agentGrant:
      type: apiKey
      in: header
      name: X-ATI-Agent-Grant
      description: Per-session lease grant issued at claim; always sent with X-ATI-Fencing-Token.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: LiveKit webhook JWT signed with the control-plane-only webhook key.
    tier2Service:
      type: http
      scheme: bearer
      description: Tier-2 evaluator service credential (distinct from the Tier-1 credential).

  parameters:
    InterviewId:
      name: interview_id
      in: path
      required: true
      schema: {type: string, pattern: '^ses_[A-Za-z0-9]{16,}$'}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string, pattern: '^ses_[A-Za-z0-9]{16,}$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$'}
    FencingToken:
      name: X-ATI-Fencing-Token
      in: header
      required: true
      schema: {type: integer, minimum: 1}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, pattern: '^rvt_[A-Za-z0-9]{16,}$'}

  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CandidateView:
      description: Updated candidate view.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InterviewCandidateView'}
    Tier1ContextResponse:
      description: Latest Tier-1 context after the operation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Tier1Context'}
    SegmentAccepted:
      description: Segment stored (201) or an identical retry (200).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SegmentAccepted'}

  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        request_id: {type: string}

    StateEnum:
      enum: [CREATED, CONSENT_PENDING, READY, CALIBRATION, QUESTION_ACTIVE, CANDIDATE_SPEAKING, PAUSED, INTERVIEW_COMPLETED, EVALUATION_PENDING, HUMAN_REVIEW, REPORT_READY, CANCELLED]

    CreateInterviewRequest:
      type: object
      additionalProperties: false
      required: [candidate_ref, plan_id, plan_version]
      properties:
        candidate_ref: {type: string, minLength: 1, maxLength: 128, description: 'Opaque external reference (no names or emails).'}
        plan_id: {type: string, pattern: '^plan_[a-z0-9_]{3,60}$'}
        plan_version: {type: integer, minimum: 1}
        notice_language: {enum: [en, tr]}
        invitation_ttl_minutes: {type: integer, minimum: 5, maximum: 10080}

    CreateInterviewResponse:
      type: object
      additionalProperties: false
      required: [interview, invitation_url, access_code, invitation_expires_at]
      properties:
        interview: {$ref: '#/components/schemas/InterviewStaffView'}
        invitation_url:
          type: [string, 'null']
          description: |
            Public origin + /i#token=… (fragment-borne token). Returned exactly once: an idempotent replay returns
            null because the token is stored only as a hash. A caller that lost it revokes the invitation and creates
            a new interview.
        access_code:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$'
          description: |
            With the application number (in `interview`), signs the candidate in without the link (ADR-024). Returned
            exactly once, like `invitation_url`, and null in a replay: it is stored only as an argon2id hash.
        invitation_expires_at: {type: string, format: date-time}

    Progress:
      type: object
      additionalProperties: false
      required: [completed_items, total_items]
      properties:
        completed_items: {type: integer, minimum: 0}
        total_items: {type: integer, minimum: 1}

    InterviewStaffView:
      type: object
      additionalProperties: false
      required: [id, state, state_version, candidate_ref, application_number, plan, input_mode, recording, progress, created_at, updated_at]
      properties:
        id: {type: string}
        state: {$ref: '#/components/schemas/StateEnum'}
        state_version: {type: integer, minimum: 1}
        candidate_ref: {type: string}
        application_number:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$'
          description: The number the candidate signs in with (ADR-024); not a secret. Null for interviews created before it.
        plan:
          type: object
          additionalProperties: false
          required: [plan_id, version, synthetic]
          properties:
            plan_id: {type: string}
            version: {type: integer}
            synthetic: {type: boolean}
        input_mode: {enum: [voice, text, null]}
        recording:
          type: object
          additionalProperties: false
          required: [consented, active]
          properties:
            consented: {type: [boolean, 'null']}
            active: {type: boolean}
        progress: {$ref: '#/components/schemas/Progress'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    InterviewCandidateView:
      type: object
      additionalProperties: false
      required: [id, state, state_version, progress, input_mode, active_prompt, paused_from, pending_completion, recording_active, allowed_actions, environment,
        application_number, interview_title, language]
      properties:
        id: {type: string}
        state: {$ref: '#/components/schemas/StateEnum'}
        state_version: {type: integer, minimum: 1}
        progress: {$ref: '#/components/schemas/Progress'}
        input_mode: {enum: [voice, text, null]}
        active_prompt:
          oneOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [activation_id, kind, text]
              properties:
                activation_id: {type: string}
                kind: {enum: [question, follow_up]}
                text: {type: string, description: 'Displayed for accessibility; identical to what the interviewer is asked to say.'}
        paused_from: {enum: [CALIBRATION, QUESTION_ACTIVE, CANDIDATE_SPEAKING, null]}
        pending_completion: {type: boolean}
        recording_active: {type: boolean}
        allowed_actions:
          type: array
          items: {enum: [consent, start, begin, pause, resume, finish_answer, withdraw, text_response, join_media]}
        environment: {enum: [dev, test, staging, production]}
        application_number:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$'
          description: The candidate's application number (ADR-024); null for interviews created before it.
        interview_title: {type: string, maxLength: 200, description: "The interview's name (the plan's title)."}
        language: {enum: [en, tr], description: "The language the interview is held in; the page's may differ."}

    RevokeInvitationResponse:
      type: object
      additionalProperties: false
      required: [interview, revoked]
      properties:
        interview: {$ref: '#/components/schemas/InterviewStaffView'}
        revoked:
          type: object
          additionalProperties: false
          required: [invitations, candidate_sessions, paused, room_deleted]
          properties:
            invitations: {type: integer, minimum: 0, description: 'Invitations revoked by this request (0 when repeated).'}
            candidate_sessions: {type: integer, minimum: 0}
            paused: {type: boolean, description: 'A live interview was paused with reason access_revoked.'}
            room_deleted: {type: boolean}

    InvitationExchangeRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 32, maxLength: 128}

    CandidateSignInRequest:
      type: object
      additionalProperties: false
      required: [application_number, access_code]
      properties:
        application_number: {type: string, maxLength: 32, description: 'XXXX-XXXX as given; case, spaces and hyphens do not matter.'}
        access_code: {type: string, maxLength: 32, description: 'XXXXX-XXXXX as given; case, spaces and hyphens do not matter.'}

    InvitationExchangeResponse:
      type: object
      additionalProperties: false
      required: [interview_id, state]
      properties:
        interview_id: {type: string}
        state: {$ref: '#/components/schemas/StateEnum'}

    ConsentNoticeView:
      type: object
      additionalProperties: false
      required: [notice, retention_days]
      properties:
        notice: {$ref: '../../../contracts/schemas/consent/v1/consent-notice.schema.json'}
        retention_days:
          type: object
          additionalProperties: false
          required: [transcript, session_events, assessment_output, audio_recording]
          properties:
            transcript: {type: integer, minimum: 1}
            session_events: {type: integer, minimum: 1}
            assessment_output: {type: integer, minimum: 1}
            audio_recording: {type: [integer, 'null'], minimum: 1}

    ConsentDecisionRequest:
      type: object
      additionalProperties: false
      required: [notice_id, notice_version, decisions]
      properties:
        notice_id: {type: string}
        notice_version: {type: string}
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purpose_id, granted]
            properties:
              purpose_id: {type: string}
              granted: {type: boolean}

    StateVersionRequest:
      type: object
      additionalProperties: false
      required: [state_version]
      properties:
        state_version: {type: integer, minimum: 1}

    StartRequest:
      type: object
      additionalProperties: false
      required: [state_version, input_mode]
      properties:
        state_version: {type: integer, minimum: 1}
        input_mode: {enum: [voice, text]}

    CandidatePauseRequest:
      type: object
      additionalProperties: false
      required: [state_version, reason]
      properties:
        state_version: {type: integer, minimum: 1}
        reason: {enum: [candidate_request, device_lost]}

    AnswerCompletionRequest:
      type: object
      additionalProperties: false
      required: [state_version, activation_id]
      properties:
        state_version: {type: integer, minimum: 1}
        activation_id: {type: string, pattern: '^act_[A-Za-z0-9]{16,}$'}

    WithdrawRequest:
      type: object
      additionalProperties: false
      required: [state_version, confirm]
      properties:
        state_version: {type: integer, minimum: 1}
        confirm: {const: true}

    RealtimeSession:
      type: object
      additionalProperties: false
      required: [livekit_url, token, room, identity, can_publish_audio, expires_at]
      properties:
        livekit_url: {type: string}
        token: {type: string}
        room: {type: string}
        identity: {const: candidate}
        can_publish_audio: {type: boolean}
        expires_at: {type: string, format: date-time}

    TextResponseRequest:
      type: object
      additionalProperties: false
      required: [activation_id, text]
      properties:
        activation_id: {type: string, pattern: '^act_[A-Za-z0-9]{16,}$'}
        text: {type: string, minLength: 1, maxLength: 4000}

    TextResponseAccepted:
      type: object
      additionalProperties: false
      required: [segment_id, state, state_version]
      properties:
        segment_id: {type: string}
        state: {$ref: '#/components/schemas/StateEnum'}
        state_version: {type: integer, minimum: 1}

    Tier1ClaimRequest:
      type: object
      additionalProperties: false
      required: [session_id, claim_nonce, job_id, agent_identity]
      properties:
        session_id: {type: string, pattern: '^ses_[A-Za-z0-9]{16,}$'}
        claim_nonce: {type: string, minLength: 32, maxLength: 128}
        job_id: {type: string, minLength: 1, maxLength: 128}
        agent_identity: {type: string, minLength: 1, maxLength: 128}

    Tier1Lease:
      type: object
      additionalProperties: false
      required: [lease_id, grant, fencing_token, expires_at_unix_ms, renew_interval_ms, context]
      properties:
        lease_id: {type: string}
        grant: {type: string}
        fencing_token: {type: integer, minimum: 1}
        expires_at_unix_ms: {type: integer}
        renew_interval_ms: {type: integer, minimum: 100}
        context: {$ref: '#/components/schemas/Tier1Context'}

    Tier1LeaseRenewal:
      type: object
      additionalProperties: false
      required: [expires_at_unix_ms, context]
      properties:
        expires_at_unix_ms: {type: integer}
        context: {$ref: '#/components/schemas/Tier1Context'}

    Tier1Context:
      $ref: '../../../contracts/schemas/tier1/v1/tier1-context.schema.json'

    SegmentSubmission:
      $ref: '../../../contracts/schemas/transcript/v1/segment-submission.schema.json'

    SegmentAccepted:
      type: object
      additionalProperties: false
      required: [segment_id, sequence, question_id, activation_id, evidence_eligible, flags, state_version]
      properties:
        segment_id: {type: string}
        sequence: {type: integer, minimum: 1}
        question_id: {type: [string, 'null']}
        activation_id: {type: [string, 'null']}
        evidence_eligible: {type: boolean}
        flags:
          type: object
          additionalProperties: {type: boolean}
        state_version: {type: integer, minimum: 1}

    PromptStartedRequest:
      type: object
      additionalProperties: false
      required: [activation_id, at_ms]
      properties:
        activation_id: {type: string, pattern: '^act_[A-Za-z0-9]{16,}$'}
        at_ms: {type: integer, minimum: 0}

    Tier1AnswerCompleteRequest:
      type: object
      additionalProperties: false
      required: [state_version, activation_id, flushed_segment_keys, cause]
      properties:
        state_version: {type: integer, minimum: 1}
        activation_id: {type: string, pattern: '^act_[A-Za-z0-9]{16,}$'}
        flushed_segment_keys:
          type: array
          maxItems: 500
          uniqueItems: true
          items: {type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$'}
        cause: {enum: [agent_tool, candidate_request]}

    Tier1PauseRequest:
      type: object
      additionalProperties: false
      required: [state_version, reason]
      properties:
        state_version: {type: integer, minimum: 1}
        reason: {enum: [provider_failure, audio_unavailable]}

    TelemetryReport:
      type: object
      additionalProperties: false
      required: [metrics, policy_flags]
      properties:
        metrics:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [name, value_ms]
            properties:
              name: {enum: [voice_ttfb_ms, voice_ttfa_ms, voice_end_of_turn_ms, voice_full_response_ms, barge_in_stop_latency_ms]}
              value_ms: {type: number, minimum: 0}
        policy_flags:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [flag, activation_id]
            properties:
              flag: {enum: [possible_score_disclosure, possible_rubric_disclosure, possible_prompt_disclosure]}
              activation_id: {type: [string, 'null']}

    UsageReport:
      type: object
      additionalProperties: false
      required: [engine, input_audio_ms, output_audio_ms]
      properties:
        engine: {enum: [openai_realtime, scripted]}
        model: {type: [string, 'null'], maxLength: 128}
        input_audio_ms: {type: integer, minimum: 0}
        output_audio_ms: {type: integer, minimum: 0}
        input_text_tokens: {type: [integer, 'null'], minimum: 0}
        output_text_tokens: {type: [integer, 'null'], minimum: 0}
        input_audio_tokens: {type: [integer, 'null'], minimum: 0}
        output_audio_tokens: {type: [integer, 'null'], minimum: 0}

    DimensionScores:
      type: object
      additionalProperties: false
      required: [technical_accuracy, architecture_maturity, edge_case_awareness, claim_support]
      properties:
        technical_accuracy: {type: integer, minimum: 0, maximum: 100}
        architecture_maturity: {type: integer, minimum: 0, maximum: 100}
        edge_case_awareness: {type: integer, minimum: 0, maximum: 100}
        claim_support: {type: integer, minimum: 0, maximum: 100}

    EvaluationSubmission:
      type: object
      additionalProperties: false
      required: [answer_id, transcript_version, evaluator_version, provider, outcome]
      properties:
        answer_id: {type: string, pattern: '^ans_[A-Za-z0-9]{16,}$'}
        transcript_version: {type: integer, minimum: 1}
        evaluator_version: {type: string, pattern: '^[A-Za-z0-9_.:@/-]{1,200}$'}
        provider: {enum: [reference, openai, anthropic]}
        model_id: {type: [string, 'null'], maxLength: 128}
        prompt_sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        provider_request_id: {type: [string, 'null'], maxLength: 200}
        outcome: {enum: [evaluated, abstained, failed]}
        output: {description: 'The evaluator output as received (evaluation contract v1); required when outcome is evaluated.'}
        reason: {type: [string, 'null'], pattern: '^[a-z0-9_]{1,64}$', description: 'Required when outcome is abstained or failed.'}
        latency_ms: {type: [integer, 'null'], minimum: 0}
        input_tokens: {type: [integer, 'null'], minimum: 0}
        output_tokens: {type: [integer, 'null'], minimum: 0}

    RecordedEvaluation:
      type: object
      additionalProperties: false
      required: [attempt_id, evaluation_id, outcome, problems]
      properties:
        attempt_id: {type: string}
        evaluation_id: {type: [string, 'null']}
        outcome: {enum: [valid, invalid, abstained, failed, duplicate]}
        problems: {type: array, items: {type: string}, description: 'Why the output was rejected; never echoes its content.'}

    CompleteEvaluationRequest:
      type: object
      additionalProperties: false
      properties:
        failure_reason: {type: [string, 'null'], pattern: '^[a-z0-9_]{1,64}$'}

    ReviewRouting:
      type: object
      additionalProperties: false
      required: [state, review_tasks]
      properties:
        state: {$ref: '#/components/schemas/StateEnum'}
        review_tasks: {type: integer, minimum: 0}

    ReviewTaskSummary:
      type: object
      additionalProperties: false
      required: [task_id, interview_id, answer_id, item_id, status, reasons, has_ai_evaluation, created_at, completed_at]
      properties:
        task_id: {type: string}
        interview_id: {type: string}
        answer_id: {type: string}
        item_id: {type: string}
        status: {enum: [open, completed]}
        reasons: {type: array, items: {type: string}}
        has_ai_evaluation: {type: boolean}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}

    ReviewTaskList:
      type: object
      additionalProperties: false
      required: [review_tasks]
      properties:
        review_tasks: {type: array, items: {$ref: '#/components/schemas/ReviewTaskSummary'}}

    ReviewTask:
      allOf:
        - {$ref: '#/components/schemas/ReviewTaskSummary'}
        - type: object
          required: [language, question, rubric_ref, rubric, transcript, ai_evaluation, outcome]
          properties:
            language: {enum: [en, tr]}
            question: {type: string}
            rubric_ref:
              type: [string, 'null']
              pattern: '^rub_[a-z0-9_]{3,60}@[1-9][0-9]*$'
              description: >-
                rubric_id@version of the question's rubric; null when the question has none (reviewed with a rationale
                only). A rubric_ref with a null rubric means the rubric is not stored, and the answer cannot be decided.
            rubric: {type: [object, 'null'], description: 'Rubric contract v1 without the synthetic indicators.'}
            transcript:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [segment_id, start_ms, end_ms, text]
                properties:
                  segment_id: {type: string}
                  start_ms: {type: integer}
                  end_ms: {type: integer}
                  text: {type: string}
            ai_evaluation:
              description: The first valid AI evaluation, an uncalibrated draft; null when none validated.
              type: [object, 'null']
              properties:
                evaluation_id: {type: string}
                evaluator_version: {type: string}
                scores: {$ref: '#/components/schemas/DimensionScores'}
                weighted_score: {type: number, minimum: 0, maximum: 100}
                confidence: {type: number, minimum: 0, maximum: 1}
                calibrated: {const: false}
                advisory_next_step: {enum: [NEXT_QUESTION, FOLLOW_UP, HUMAN_REVIEW], description: 'The evaluator''s advisory interview step (conflict C5); never a hiring recommendation.'}
                evaluator_output_risk: {enum: [low, medium, high]}
                routing_reasons: {type: array, items: {type: string}}
                evidence: {type: array, items: {type: object}}
            outcome:
              type: [object, 'null']
              properties:
                outcome_id: {type: string}
                reviewer_id: {type: string}
                scores:
                  description: Null when the question has no rubric (reviewed with a rationale only).
                  oneOf: [{type: 'null'}, {$ref: '#/components/schemas/DimensionScores'}]
                weighted_score: {type: [number, 'null']}
                rationale: {type: string}
                ai_draft_viewed: {type: boolean, description: Whether the reviewer opened the AI draft before deciding.}
                decided_at: {type: string, format: date-time}

    ReviewDecision:
      type: object
      additionalProperties: false
      description: >-
        Scores for every dimension of the answer's rubric, and a rationale. An answer whose question has no
        rubric cannot be scored: it is reviewed with a rationale only, and scores are refused.
      required: [rationale]
      properties:
        scores:
          oneOf: [{type: 'null'}, {$ref: '#/components/schemas/DimensionScores'}]
        rationale: {type: string, minLength: 10, maxLength: 4000}
        ai_draft_viewed:
          type: boolean
          default: false
          description: >-
            Whether the reviewer opened the AI draft before deciding, recorded for the study of automation bias.
            Recorded as false when the answer had no AI draft.

    ReviewOutcomeResult:
      type: object
      additionalProperties: false
      required: [outcome_id, interview_state, open_review_tasks]
      properties:
        outcome_id: {type: string}
        interview_state: {$ref: '#/components/schemas/StateEnum'}
        open_review_tasks: {type: integer, minimum: 0}

    Report:
      type: object
      additionalProperties: false
      required: [report_version, interview_id, generated_at, plan, language, decision_support_only, notice, answers]
      properties:
        report_version: {const: 1}
        interview_id: {type: string}
        generated_at: {type: string, format: date-time}
        plan:
          type: object
          required: [plan_id, version, synthetic]
          properties:
            plan_id: {type: string}
            version: {type: integer}
            synthetic: {type: boolean}
        language: {enum: [en, tr]}
        decision_support_only: {const: true}
        notice: {type: string}
        answers:
          type: array
          items:
            type: object
            required: [answer_id, item_id, question, rubric, rubric_synthetic, reviewed, review_reasons, ai_evaluation]
            properties:
              answer_id: {type: string}
              item_id: {type: string}
              question: {type: string}
              rubric: {type: [string, 'null'], description: 'rubric_id@version; null when the question has no rubric.'}
              rubric_synthetic: {type: [boolean, 'null']}
              reviewed:
                type: object
                required: [scores, weighted_score, rationale, reviewer_id, decided_at]
                properties:
                  scores:
                    oneOf: [{type: 'null'}, {$ref: '#/components/schemas/DimensionScores'}]
                  weighted_score: {type: [number, 'null'], minimum: 0, maximum: 100}
                  rationale: {type: string}
                  ai_draft_viewed: {type: boolean, description: 'Absent from reports written before ADR-023.'}
                  reviewer_id: {type: string}
                  decided_at: {type: string, format: date-time}
              review_reasons: {type: array, items: {type: string}}
              ai_evaluation: {type: [object, 'null']}

    ReportSummary:
      type: object
      additionalProperties: false
      required: [interview_id, generated_at, plan, language, answer_count]
      properties:
        interview_id: {type: string}
        generated_at: {type: string, format: date-time}
        plan:
          type: object
          additionalProperties: false
          required: [plan_id, version, synthetic]
          properties:
            plan_id: {type: string}
            version: {type: integer}
            synthetic: {type: boolean}
        language: {enum: [en, tr]}
        answer_count: {type: integer, minimum: 0}

    ReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports: {type: array, items: {$ref: '#/components/schemas/ReportSummary'}}

    StaffSignInRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, pattern: '^ati_st_[A-Za-z0-9_-]{20,120}$', description: A staff token from ati-admin; never stored or logged.}

    StaffSessionView:
      type: object
      additionalProperties: false
      required: [role, label, expires_at]
      properties:
        role: {enum: [admin, recruiter, reviewer]}
        label: {type: string}
        expires_at: {type: string, format: date-time, description: When the credential used stops working.}

    StaffSessionEnded:
      type: object
      additionalProperties: false
      required: [ended]
      properties:
        ended: {type: boolean}
