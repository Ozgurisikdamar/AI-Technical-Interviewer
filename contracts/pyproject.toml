[project]
name = "ati-contracts"
version = "0.1.0"
description = "Contract tests for machine-readable interview platform contracts (schemas, state machine, prompts, OpenAPI)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "jsonschema>=4.26,<5",
  "rfc3339-validator>=0.1.4",
  "pyyaml>=6.0.2",
  "openapi-spec-validator>=0.7.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
